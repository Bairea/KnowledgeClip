global:
  server_port: 8080

sites:
  - id: qwen
    name: Qwen
    url: https://chat.qwen.ai/
    enabled: true
    engine:
      primary: cdp
      selectors:
        input: "textarea.message-input-textarea"
        submit: "div.message-input-right-button-send"
        answer: "[class*=message-content]"
        wait_for: "textarea.message-input-textarea"
    format_prompt: ""

  - id: kimi
    name: Kimi
    url: https://www.kimi.com/
    enabled: true
    engine:
      primary: cdp
      selectors:
        input: "div.chat-input-editor"
        submit: "div.send-button-container"
        answer: "[class*=answer]"
        wait_for: "div.chat-input-editor"
    format_prompt: ""

  - id: deepseek
    name: DeepSeek
    url: https://chat.deepseek.com/
    enabled: true
    engine:
      primary: cdp
      selectors:
        input: "textarea"
        submit: "div[class*=send]"
        answer: "[class*=message-content]"
        wait_for: "textarea"
    format_prompt: ""
